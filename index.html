<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>闽教版小学英语背单词</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-dark: #4338CA;
      --success: #10B981;
      --danger: #EF4444;
      --bg: #F3F4F6;
      --card: #FFFFFF;
      --text: #1F2937;
      --muted: #6B7280;
      --border: #E5E7EB;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--primary);
      color: #fff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    header h1 { font-size: 18px; margin: 0; font-weight: 600; }
    header nav button {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 13px;
      margin-left: 8px;
      cursor: pointer;
    }
    header nav button.active { background: #fff; color: var(--primary); }
    main { flex: 1; overflow-y: auto; padding: 16px; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }
    .progress-bar {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }
    .stats { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .question-box { text-align: center; margin-bottom: 20px; }
    .direction { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
    .prompt {
      font-size: 28px;
      font-weight: 700;
      word-break: break-word;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .prompt-sub { font-size: 14px; color: var(--muted); }
    .audio-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      color: var(--primary);
    }
    .options { display: grid; gap: 12px; }
    .option {
      background: #F9FAFB;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 17px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
      display: flex;
      align-items: center;
    }
    .option:active { transform: scale(0.98); }
    .option:hover { border-color: #C7D2FE; background: #EEF2FF; }
    .option.correct { border-color: var(--success); background: #D1FAE5; color: #065F46; }
    .option.wrong { border-color: var(--danger); background: #FEE2E2; color: #991B1B; }
    .option.disabled { pointer-events: none; }
    .feedback {
      text-align: center;
      margin-top: 14px;
      font-weight: 600;
      min-height: 22px;
    }
    .feedback.correct { color: var(--success); }
    .feedback.wrong { color: var(--danger); }
    .btn-primary {
      display: block;
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary {
      display: block;
      width: 100%;
      background: #fff;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }
    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
    .word-list { display: grid; gap: 10px; }
    .word-item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .word-item .en { font-weight: 600; font-size: 16px; }
    .word-item .cn { color: var(--muted); font-size: 14px; text-align: right; }
    .mistake-row {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .mistake-row .top { display: flex; justify-content: space-between; align-items: center; }
    .mistake-row .en { font-weight: 700; font-size: 17px; }
    .mistake-row .cn { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .mistake-row .date { font-size: 12px; color: var(--muted); }
    .tag {
      display: inline-block;
      background: #E0E7FF;
      color: var(--primary);
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-right: 6px;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 0;
    }
    .mode-select { display: flex; gap: 10px; margin-bottom: 16px; }
    .mode-select button { flex: 1; padding: 12px; border-radius: 12px; border: 1.5px solid var(--border); background: #fff; cursor: pointer; font-size: 15px; }
    .mode-select button.active { border-color: var(--primary); background: #EEF2FF; color: var(--primary); font-weight: 600; }
    .unit-filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .unit-filter button { padding: 6px 12px; border-radius: 16px; border: 1px solid var(--border); background: #fff; font-size: 13px; cursor: pointer; }
    .unit-filter button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .semester-select { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .semester-select button { padding: 8px 14px; border-radius: 16px; border: 1px solid var(--border); background: #fff; font-size: 14px; cursor: pointer; }
    .semester-select button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .hidden { display: none !important; }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 12px; }
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>闽教版小学英语</h1>
    <nav>
      <button id="nav-practice" class="active" onclick="showPage('practice')">背词</button>
      <button id="nav-wordlist" onclick="showPage('wordlist')">词表</button>
      <button id="nav-mistakes" onclick="showPage('mistakes')">错题</button>
    </nav>
  </header>

  <main>
    <!-- 练习页 -->
    <section id="page-practice">
      <div class="card">
        <div class="section-title" style="font-size:15px;color:var(--muted);font-weight:500;margin-bottom:8px">选择学期</div>
        <div class="semester-select" id="semester-select"></div>
        <div class="mode-select">
          <button id="mode-en2cn" class="active" onclick="setMode('en2cn')">英译汉</button>
          <button id="mode-cn2en" onclick="setMode('cn2en')">汉译英</button>
        </div>
        <div class="unit-filter" id="unit-filter"></div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="stats">
          <span id="stat-progress">进度 0/0</span>
          <span id="stat-streak">连对 0</span>
        </div>
        <div class="question-box">
          <div class="direction" id="direction">请选择正确的中文释义</div>
          <div class="prompt" id="prompt"></div>
          <button class="audio-btn" id="audio-btn" title="英式发音">🔊</button>
          <div class="prompt-sub" id="prompt-sub"></div>
        </div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback"></div>
        <button class="btn-primary hidden" id="next-btn" onclick="nextQuestion()">下一题</button>
      </div>
      <button class="btn-secondary" onclick="restartPractice()">重新开始</button>
    </section>

    <!-- 词表页 -->
    <section id="page-wordlist" class="hidden">
      <div class="card">
        <div class="section-title">全部单词</div>
        <div class="semester-select" id="wordlist-semester-select"></div>
        <div class="unit-filter" id="wordlist-unit-filter"></div>
        <div class="word-list" id="word-list"></div>
      </div>
    </section>

    <!-- 错题页 -->
    <section id="page-mistakes" class="hidden">
      <div class="card">
        <div class="section-title">错题整理</div>
        <div id="mistake-list"></div>
        <button class="btn-primary" id="retest-btn" onclick="startRetest()">重测错题</button>
        <button class="btn-secondary" onclick="clearMistakes()">清空错题</button>
      </div>
    </section>
  </main>

  <footer>本地背单词 · 数据保存在浏览器中</footer>
  <div class="toast" id="toast"></div>

          { unit: 3, en: "took pictures", cn: "照相", ipa: "tʊk ˈpɪktʃəz" },

          { unit: 3, en: "gift", cn: "礼物", ipa: "ɡɪft" },
          { unit: 3, en: "fell", cn: "摔倒（fall的过去式）", ipa: "fel" },
          { unit: 3, en: "off", cn: "从（某处）落下", ipa: "ɒf" },
          { unit: 3, en: " Labour Day", cn: "劳动节", ipa: "ˈleɪbə deɪ" },
          { unit: 3, en: "mule", cn: "骡子", ipa: "mjuːl" },
          { unit: 3, en: "couldn't", cn: "不能", ipa: "ˈkʊdnt" },
          { unit: 3, en: "till", cn: "直到", ipa: "tɪl" },
          { unit: 4, en: "library", cn: "图书馆", ipa: "ˈlaɪbrəri" },
          { unit: 4, en: "sunny", cn: "晴朗的", ipa: "ˈsʌni" },
          { unit: 4, en: "windy", cn: "有风的", ipa: "ˈwɪndi" },
          { unit: 4, en: "rainy", cn: "下雨的", ipa: "ˈreɪni" },
          { unit: 4, en: "cloudy", cn: "多云的", ipa: "ˈklaʊdi" },
          { unit: 4, en: "snowy", cn: "下雪的", ipa: "ˈsnəʊi" },
          { unit: 4, en: "weather", cn: "天气", ipa: "ˈweðə(r)" },
          { unit: 4, en: "cold", cn: "冷的", ipa: "kəʊld" },
          { unit: 4, en: "warm", cn: "暖和的", ipa: "wɔːm" },
          { unit: 4, en: "cool", cn: "凉爽的", ipa: "kuːl" },
          { unit: 4, en: "hot", cn: "热的", ipa: "hɒt" },
          { unit: 4, en: "degree", cn: "度；度数", ipa: "dɪˈɡriː" },
          { unit: 5, en: "favourite", cn: "特别喜爱的", ipa: "ˈfeɪvərɪt" },
          { unit: 5, en: "colour", cn: "颜色", ipa: "ˈkʌlə(r)" },
          { unit: 5, en: "yellow", cn: "黄色（的）", ipa: "ˈjeləʊ" },
          { unit: 5, en: "green", cn: "绿色（的）", ipa: "ɡriːn" },
          { unit: 5, en: "red", cn: "红色（的）", ipa: "red" },
          { unit: 5, en: "blue", cn: "蓝色（的）", ipa: "bluː" },
          { unit: 5, en: "black", cn: "黑色（的）", ipa: "blæk" },
          { unit: 5, en: "brown", cn: "棕色（的）", ipa: "braʊn" },
          { unit: 5, en: "white", cn: "白色（的）", ipa: "waɪt" },
          { unit: 5, en: "pink", cn: "粉色（的）", ipa: "pɪŋk" },
          { unit: 5, en: "orange", cn: "橙色（的）", ipa: "ˈɒrɪndʒ" },
          { unit: 5, en: "purple", cn: "紫色（的）", ipa: "ˈpɜːpl" },
          { unit: 5, en: "toy", cn: "玩具", ipa: "tɔɪ" },
          { unit: 5, en: "balloon", cn: "气球", ipa: "bəˈluːn" },
          { unit: 5, en: "kite", cn: "风筝", ipa: "kaɪt" },
          { unit: 6, en: "dining hall", cn: "饭厅", ipa: "ˈdaɪnɪŋ hɔːl" },
          { unit: 6, en: "grass", cn: "草坪", ipa: "ɡrɑːs" },
          { unit: 6, en: "gym", cn: "体育馆", ipa: "dʒɪm" },
          { unit: 6, en: "ago", cn: "以前", ipa: "əˈɡəʊ" },
          { unit: 6, en: "cycling", cn: "骑自行车运动", ipa: "ˈsaɪklɪŋ" },
          { unit: 6, en: "ice-skate", cn: "滑冰", ipa: "ˈaɪs skeɪt" },
          { unit: 6, en: "badminton", cn: "羽毛球运动", ipa: "ˈbædmɪntən" },
          { unit: 6, en: "star", cn: "星", ipa: "stɑː(r)" },
          { unit: 6, en: "easy", cn: "容易的", ipa: "ˈiːzi" },
          { unit: 6, en: "look up", cn: "查阅", ipa: "lʊk ʌp" },
          { unit: 6, en: "Internet", cn: "互联网", ipa: "ˈɪntənet" },
          { unit: 6, en: "different", cn: "不同的", ipa: "ˈdɪfrənt" },
          { unit: 6, en: "active", cn: "积极的；活跃的", ipa: "ˈæktɪv" }
        ]
      }
    ];

    // 合并为一个扁平词库，用于抽干扰项
    const allWords = allData.flatMap(s => s.words.map(w => ({ ...w, semester: s.semester })));

    // 状态
    const STORAGE_KEY = "fujian_vocab_v2";
    let currentSemester = allData[0].semester;
    let mode = "en2cn";
    let selectedUnits = new Set();
    let queue = [];
    let index = 0;
    let streak = 0;
    let currentQuestion = null;
    let answered = false;
    let mistakes = [];

    function loadMistakes() {
      try { mistakes = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { mistakes = []; }
    }
    function saveMistakes() { localStorage.setItem(STORAGE_KEY, JSON.stringify(mistakes)); }

    function getSemesterWords(semester) {
      return allData.find(s => s.semester === semester)?.words || [];
    }
    function getCurrentUnits() {
      const ws = getSemesterWords(currentSemester);
      return [...new Set(ws.map(w => w.unit))].sort((a,b) => a-b);
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2000);
    }

    function renderSemesterFilters() {
      const container = document.getElementById("semester-select");
      const wlContainer = document.getElementById("wordlist-semester-select");
      const html = allData.map(s => `<button class="${s.semester === currentSemester ? 'active' : ''}" onclick="setSemester('${s.semester.replace(/'/g, "\\'")}')">${s.semester}</button>`).join("");
      container.innerHTML = html;
      wlContainer.innerHTML = html;
    }

    function setSemester(sem) {
      currentSemester = sem;
      selectedUnits = new Set(getCurrentUnits());
      renderSemesterFilters();
      renderUnitFilters();
      renderWordList();
      restartPractice();
    }

    function renderUnitFilters() {
      const container = document.getElementById("unit-filter");
      const wlContainer = document.getElementById("wordlist-unit-filter");
      const units = getCurrentUnits();
      const html = units.map(u => `<button class="${selectedUnits.has(u) ? 'active' : ''}" data-unit="${u}" onclick="toggleUnit(${u})">Unit ${u}</button>`).join("");
      container.innerHTML = html;
      wlContainer.innerHTML = html;
    }

    function toggleUnit(u) {
      if (selectedUnits.has(u)) {
        if (selectedUnits.size > 1) selectedUnits.delete(u);
        else { showToast("至少选择一个单元"); return; }
      } else selectedUnits.add(u);
      renderUnitFilters();
      restartPractice();
      renderWordList();
    }

    function setMode(m) {
      mode = m;
      document.getElementById("mode-en2cn").classList.toggle("active", m === "en2cn");
      document.getElementById("mode-cn2en").classList.toggle("active", m === "cn2en");
      restartPractice();
    }

    function buildQueue() {
      const pool = getSemesterWords(currentSemester).filter(w => selectedUnits.has(w.unit));
      queue = shuffle(pool.map((w, i) => ({ ...w, originalIndex: i })));
      index = 0;
      streak = 0;
      answered = false;
      updateStats();
    }

    function updateStats() {
      document.getElementById("stat-progress").textContent = `进度 ${Math.min(index + (answered ? 1 : 0), queue.length)}/${queue.length}`;
      document.getElementById("stat-streak").textContent = `连对 ${streak}`;
      const pct = queue.length ? ((index + (answered ? 1 : 0)) / queue.length * 100) : 0;
      document.getElementById("progress-fill").style.width = pct + "%";
    }

    // 发音：优先系统语音，否则在线音频
    let audio = new Audio();
    function speak(text) {
      if (!text) return;
      // 1. 尝试 Web Speech API
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "en-GB";
        u.rate = 0.9;
        // 尽量选英式男/女声
        const voices = window.speechSynthesis.getVoices();
        const enVoice = voices.find(v => v.lang === "en-GB") || voices.find(v => v.lang.startsWith("en"));
        if (enVoice) u.voice = enVoice;
        window.speechSynthesis.speak(u);
      }
      // 2. 同时播放在线音频作为 fallback / 增强
      try {
        audio.pause();
        audio.src = "https://dict.youdao.com/dictvoice?type=1&audio=" + encodeURIComponent(text);
        audio.play().catch(() => {});
      } catch {}
    }

    // 确保语音列表加载完成
    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = () => {};
      window.speechSynthesis.getVoices();
    }

    function renderQuestion() {
      answered = false;
      currentQuestion = queue[index];
      const q = currentQuestion;
      const direction = mode === "en2cn" ? "请选择正确的中文释义" : "请选择正确的英文单词/词组";
      const prompt = mode === "en2cn" ? q.en : q.cn;
      const sub = mode === "en2cn" ? `/${q.ipa}/` : "";
      document.getElementById("direction").textContent = direction;
      document.getElementById("prompt").textContent = prompt;
      document.getElementById("prompt-sub").textContent = sub;
      document.getElementById("feedback").textContent = "";
      document.getElementById("feedback").className = "feedback";
      document.getElementById("next-btn").classList.add("hidden");
      document.getElementById("next-btn").textContent = "下一题";

      const correct = mode === "en2cn" ? q.cn : q.en;
      const others = getSemesterWords(currentSemester)
        .filter(w => w.en !== q.en)
        .map(w => mode === "en2cn" ? w.cn : w.en);
      const distractors = shuffle(others).slice(0, 3);
      const opts = shuffle([correct, ...distractors]);

      const optsEl = document.getElementById("options");
      optsEl.innerHTML = "";
      opts.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.textContent = opt;
        btn.onclick = () => handleAnswer(opt, btn);
        optsEl.appendChild(btn);
      });

      if (mode === "en2cn") speak(q.en);
      document.getElementById("audio-btn").onclick = () => speak(q.en);
      updateStats();
    }

    function handleAnswer(selected, btn) {
      if (answered) return;
      const q = currentQuestion;
      const correct = mode === "en2cn" ? q.cn : q.en;
      const allBtns = document.querySelectorAll(".option");
      allBtns.forEach(b => b.classList.add("disabled"));

      if (selected === correct) {
        answered = true;
        btn.classList.add("correct");
        streak++;
        document.getElementById("feedback").textContent = "回答正确！";
        document.getElementById("feedback").className = "feedback correct";
        if (mode === "cn2en") speak(q.en);
        if (index < queue.length - 1) {
          document.getElementById("next-btn").classList.remove("hidden");
        } else {
          document.getElementById("next-btn").textContent = "完成练习";
          document.getElementById("next-btn").classList.remove("hidden");
        }
      } else {
        btn.classList.add("wrong");
        streak = 0;
        document.getElementById("feedback").textContent = "回答错误，请重新选择";
        document.getElementById("feedback").className = "feedback wrong";
        addMistake(q);
        setTimeout(() => {
          btn.classList.remove("wrong");
          allBtns.forEach(b => {
            if (!b.classList.contains("correct")) b.classList.remove("disabled");
          });
        }, 500);
      }
      updateStats();
    }

    function addMistake(q) {
      const exists = mistakes.find(m => m.en === q.en && m.mode === mode && m.semester === currentSemester);
      if (!exists) {
        mistakes.unshift({ en: q.en, cn: q.cn, ipa: q.ipa, unit: q.unit, semester: currentSemester, mode, date: new Date().toISOString() });
        saveMistakes();
        renderMistakes();
      }
    }

    function nextQuestion() {
      if (index < queue.length - 1) {
        index++;
        renderQuestion();
      } else {
        document.getElementById("feedback").textContent = "本组练习完成！";
        document.getElementById("feedback").className = "feedback correct";
        document.getElementById("next-btn").classList.add("hidden");
      }
    }

    function restartPractice() {
      buildQueue();
      document.getElementById("next-btn").textContent = "下一题";
      if (queue.length) renderQuestion();
      else {
        document.getElementById("prompt").textContent = "";
        document.getElementById("prompt-sub").textContent = "";
        document.getElementById("options").innerHTML = "<div class='empty'>请选择至少一个单元</div>";
      }
    }

    function renderWordList() {
      const list = document.getElementById("word-list");
      const filtered = getSemesterWords(currentSemester).filter(w => selectedUnits.has(w.unit));
      list.innerHTML = filtered.map(w => `
        <div class="word-item">
          <div>
            <div class="en">${w.en} <span class="tag">Unit ${w.unit}</span></div>
            <div style="font-size:12px;color:var(--muted)">/${w.ipa}/</div>
          </div>
          <div class="cn">${w.cn}</div>
        </div>
      `).join("");
    }

    function renderMistakes() {
      const list = document.getElementById("mistake-list");
      if (!mistakes.length) {
        list.innerHTML = "<div class='empty'>暂无错题，继续加油！</div>";
        document.getElementById("retest-btn").classList.add("hidden");
        return;
      }
      document.getElementById("retest-btn").classList.remove("hidden");
      list.innerHTML = mistakes.map(m => {
        const d = new Date(m.date);
        const dateStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
        return `
          <div class="mistake-row">
            <div class="top">
              <span class="en">${m.en}</span>
              <span class="date">${dateStr}</span>
            </div>
            <div class="cn">${m.cn}</div>
            <div style="margin-top:6px">
              <span class="tag">${m.semester}</span>
              <span class="tag">${m.mode === "en2cn" ? "英译汉" : "汉译英"}</span>
              <span class="tag">Unit ${m.unit}</span>
            </div>
          </div>
        `;
      }).join("");
    }

    function startRetest() {
      if (!mistakes.length) return;
      const pool = mistakes.map(m => {
        const found = allWords.find(w => w.en === m.en && w.semester === m.semester);
        return found || m;
      });
      currentSemester = mistakes[0].semester;
      selectedUnits = new Set(getCurrentUnits());
      mode = "en2cn";
      document.getElementById("mode-en2cn").classList.add("active");
      document.getElementById("mode-cn2en").classList.remove("active");
      renderSemesterFilters();
      renderUnitFilters();
      queue = shuffle(pool);
      index = 0;
      streak = 0;
      answered = false;
      showPage("practice");
      renderQuestion();
    }

    function clearMistakes() {
      if (!confirm("确定清空所有错题吗？")) return;
      mistakes = [];
      saveMistakes();
      renderMistakes();
    }

    function showPage(page) {
      ["practice","wordlist","mistakes"].forEach(p => document.getElementById("page-"+p).classList.add("hidden"));
      document.getElementById("page-"+page).classList.remove("hidden");
      ["practice","wordlist","mistakes"].forEach(p => document.getElementById("nav-"+p).classList.toggle("active", p === page));
      if (page === "wordlist") renderWordList();
      if (page === "mistakes") renderMistakes();
    }

    // 初始化
    loadMistakes();
    selectedUnits = new Set(getCurrentUnits());
    renderSemesterFilters();
    renderUnitFilters();
    restartPractice();
    renderMistakes();
  </script>
</body>
